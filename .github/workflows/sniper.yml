name: OP Sniper

on:
  schedule:
    # Every 15 minutes, off the hour (GitHub delays runs at :00 the most).
    # A run stays alive whenever a window opens in the next 75 minutes, so a late start still lands on time.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

# One run at a time, so two runs never book or save over each other.
concurrency:
  group: op-sniper
  cancel-in-progress: false

permissions:
  contents: write   # only for the keep-alive commit below

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet requests tzdata

      - name: Snipe
        env:
          OP_EMAIL: ${{ secrets.OP_EMAIL }}
          OP_PASSWORD: ${{ secrets.OP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OP_QUIET: "1"
        run: python opsniper.py cloud

      # GitHub switches off schedules in public repos after 60 days with no commits.
      - name: Keep the schedule switched on
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3888000 ]; then
            git config user.name "op-sniper"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep schedule switched on"
            git push
          fi
